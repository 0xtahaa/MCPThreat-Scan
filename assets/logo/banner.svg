<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">MCPThreat-Scan</title>
  <desc id="d">Zero-Execution Static Analysis for MCP servers</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101613"/>
      <stop offset="1" stop-color="#16251C"/>
    </linearGradient>
    <radialGradient id="glow" cx="170" cy="150" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#CFE9C8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#CFE9C8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#CFE9C8" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFE9C8" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#CFE9C8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#CFE9C8" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="card"><rect width="1200" height="300" rx="22"/></clipPath>
    <clipPath id="panel"><rect x="880" y="50" width="260" height="200" rx="14"/></clipPath>
    <clipPath id="revealWord"><rect class="wipe w1" x="296" y="70" width="580" height="100"/></clipPath>
    <clipPath id="revealTag"><rect class="wipe w2" x="296" y="172" width="580" height="34"/></clipPath>
  </defs>
  <style>
    .mono { font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", Consolas, ui-monospace, "SFMono-Regular", Menlo, monospace; }
    .fillbox { transform-box: fill-box; }

    /* one-time intro */
    .wipe  { transform-box: fill-box; transform-origin: left center; animation: wipe 0.9s cubic-bezier(.2,.7,.2,1) both; }
    .w1    { animation-delay: 0.45s; }
    .w2    { animation-delay: 0.95s; animation-duration: 0.8s; }
    .plane { animation: planeIn 0.7s cubic-bezier(.2,.7,.2,1) both; }
    .p1    { animation-delay: 0.05s; }
    .p2    { animation-delay: 0.20s; }
    .p3    { animation-delay: 0.35s; }
    .chip  { animation: rise 0.55s ease-out both; }
    .c1    { animation-delay: 1.45s; }
    .c2    { animation-delay: 1.60s; }
    .c3    { animation-delay: 1.75s; }
    .row   { transform-box: fill-box; transform-origin: left center; animation: draw 0.5s ease-out both; }
    .r1 { animation-delay: 1.0s; } .r2 { animation-delay: 1.1s; } .r3 { animation-delay: 1.2s; }
    .r4 { animation-delay: 1.3s; } .r5 { animation-delay: 1.4s; } .r6 { animation-delay: 1.5s; } .r7 { animation-delay: 1.35s; }

    /* loops */
    .halo   { animation: halo 4.8s ease-in-out 1.2s infinite; }
    .beam   { animation: sweep 5.6s ease-in-out 2.2s infinite; opacity: 0; }
    .hit    { animation: hitIn 0.5s ease-out 1.25s both, hit 5.6s ease-in-out 2.2s infinite; }
    .flash  { animation: flash 5.6s ease-out 2.2s infinite; opacity: 0; }
    .cursor { animation: blink 1.1s steps(1) 1.9s infinite; opacity: 0; }

    @keyframes wipe    { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes planeIn { from { opacity: 0; transform: translate(-22px, 6px); } to { opacity: 1; transform: translate(0, 0); } }
    @keyframes rise    { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes draw    { from { transform: scaleX(0); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }
    @keyframes halo    { 0%, 100% { opacity: .38; } 50% { opacity: .8; } }
    @keyframes sweep   { 0% { transform: translateY(0); opacity: 0; } 6% { opacity: 1; } 56% { transform: translateY(164px); opacity: 1; } 64% { transform: translateY(164px); opacity: 0; } 100% { transform: translateY(0); opacity: 0; } }
    @keyframes hitIn   { from { opacity: 0; } to { opacity: .55; } }
    @keyframes hit     { 0%, 26% { opacity: .55; } 31%, 36% { opacity: 1; } 55%, 100% { opacity: .55; } }
    @keyframes flash   { 0%, 28% { opacity: 0; } 31% { opacity: .55; } 48% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes blink   { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .wipe, .plane, .chip, .row, .halo, .beam, .hit, .flash, .cursor { animation: none; }
      .beam { opacity: 0; }
      .cursor { opacity: 1; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="21.5" fill="none" stroke="#365344" stroke-width="1.5"/>

  <!-- Autorea mark: planes slide in one after another, then the halo breathes -->
  <g transform="translate(69 45) scale(0.78)">
    <g class="halo" filter="url(#blur)" fill="#CFE9C8">
      <polygon points="43,56 156,12 156,87"/>
      <polygon points="32,63 214,114 32,172"/>
      <polygon points="57,179 227,121 227,258"/>
    </g>
    <polygon class="plane p1" points="43,56 156,12 156,87" fill="#CFE9C8"/>
    <polygon class="plane p2" points="32,63 214,114 32,172" fill="#CFE9C8" fill-opacity="0.82"/>
    <polygon class="plane p3" points="57,179 227,121 227,258" fill="#CFE9C8" fill-opacity="0.62"/>
  </g>

  <!-- Wordmark and tagline are revealed left to right -->
  <g clip-path="url(#revealWord)">
    <text class="mono" x="300" y="152" font-size="70" font-weight="800" textLength="528" lengthAdjust="spacingAndGlyphs" fill="#E8F2EB">MCPThreat<tspan fill="#CFE9C8">-Scan</tspan></text>
  </g>
  <g clip-path="url(#revealTag)">
    <text class="mono" x="302" y="196" font-size="21" textLength="520" lengthAdjust="spacingAndGlyphs" fill="#AFC7B7">Zero-Execution Static Analysis for MCP servers</text>
  </g>
  <rect class="cursor" x="832" y="180" width="11" height="19" fill="#CFE9C8"/>

  <!-- Feature chips -->
  <g class="mono" font-size="13" font-weight="700" fill="#CFE9C8">
    <g class="chip c1">
      <rect x="302" y="224" width="156" height="30" rx="15" fill="#18241D" stroke="#365344"/>
      <text x="380" y="244" text-anchor="middle" textLength="124" lengthAdjust="spacingAndGlyphs">ZERO-EXECUTION</text>
    </g>
    <g class="chip c2">
      <rect x="470" y="224" width="132" height="30" rx="15" fill="#18241D" stroke="#365344"/>
      <text x="536" y="244" text-anchor="middle" textLength="100" lengthAdjust="spacingAndGlyphs">OWASP-BASED</text>
    </g>
    <g class="chip c3">
      <rect x="614" y="224" width="136" height="30" rx="15" fill="#18241D" stroke="#365344"/>
      <text x="682" y="244" text-anchor="middle" textLength="104" lengthAdjust="spacingAndGlyphs">SARIF · JSON</text>
    </g>
  </g>

  <!-- Scan panel: lines draw in, the beam passes once, the flagged line lights up -->
  <rect x="880" y="50" width="260" height="200" rx="14" fill="#0C110F" stroke="#365344" stroke-width="1.5"/>
  <circle cx="900" cy="68" r="4" fill="#F0716B"/>
  <circle cx="916" cy="68" r="4" fill="#E3B341"/>
  <circle cx="932" cy="68" r="4" fill="#7FB5D6"/>
  <g clip-path="url(#panel)">
    <g fill="#365344">
      <rect class="row r1" x="904" y="94"  width="120" height="8" rx="4"/>
      <rect class="row r2" x="904" y="116" width="170" height="8" rx="4"/>
      <rect class="row r3" x="918" y="138" width="90"  height="8" rx="4"/>
      <rect class="row r4" x="904" y="182" width="110" height="8" rx="4"/>
      <rect class="row r5" x="918" y="204" width="160" height="8" rx="4"/>
      <rect class="row r6" x="904" y="226" width="100" height="8" rx="4"/>
    </g>
    <g class="hit">
      <rect x="880" y="156" width="260" height="22" fill="#F0716B" fill-opacity="0.12"/>
      <rect class="row r7" x="918" y="160" width="136" height="8" rx="4" fill="#F0716B"/>
      <rect x="880" y="156" width="3" height="22" fill="#F0716B"/>
      <text class="mono" x="1100" y="169" font-size="11" font-weight="700" fill="#F0716B" text-anchor="middle">HIGH</text>
    </g>
    <rect class="flash" x="880" y="156" width="260" height="22" fill="#F0716B"/>
    <rect class="beam" x="880" y="50" width="260" height="36" fill="url(#beam)"/>
  </g>
</svg>
