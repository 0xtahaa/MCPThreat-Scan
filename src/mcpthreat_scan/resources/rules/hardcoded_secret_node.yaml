# Hardcoded Secret for TypeScript/JavaScript (P12-5a): secrets typed directly as string literals.
# Comments must stay outside "|" blocks - inside them they become part of the pattern text.
#
# Template literals with interpolation (`Bearer ${token}`) are deliberately NOT reported: they are the
# normal way to build headers from a variable.
#
# Semgrep propagates constants, so a hardcoded secret that is later interpolated into a template
# literal can be reported a second time at that use site (same secret, not a separate finding).
#
# Known limits: only plain string literals are seen (not values built at runtime); a secret-ish
# name with a short value (< 20 characters) is not reported, and harmless long values under a
# secret-ish name are (same trade-off as the Python rule).

rules:
  - id: hardcoded-secret-node
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Hardcoded Secret: Value looks like a hardcoded API key/token/secret.
      Secrets belong in environment variables or a secret manager,
      not as a literal in source code.
    metadata:
      category: Hardcoded Secret
      kind: security
      references:
        - benchmark/vulnerable/hardcoded_api_key.ts
        - benchmark/clean/config_constants.ts

    pattern-either:
      # Variable or object-property name looks secret-ish and the value is long enough to be real.
      - patterns:
          - pattern-either:
              - pattern: $VAR = "$VAL"
              - pattern: |
                  { ..., $VAR: "$VAL", ... }
          - metavariable-regex:
              metavariable: $VAR
              regex: (?i)^.*(api_?key|token|secret|password|passwd|credential|access_?key|authorization).*$
          - metavariable-regex:
              metavariable: $VAL
              regex: ^(?!.*\$\{).{20,}$

      # Value itself starts with a known test/demo secret prefix, regardless of the name.
      - patterns:
          - pattern-either:
              - pattern: $VAR = "$VAL"
              - pattern: |
                  { ..., $VAR: "$VAL", ... }
          - metavariable-regex:
              metavariable: $VAL
              regex: (?i)^(?!.*\$\{)(demo_key_|srv_test_|bearer\s).+$
