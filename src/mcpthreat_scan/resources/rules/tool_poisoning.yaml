# Tool Poisoning: docstring text that could hide an instruction aimed at an AI agent reading it
# as a tool description. Keyword match only - always a review candidate, never a verdict
# on its own (Layer-2 AI review in analyzers/ai_review.py makes that call).

rules:
  - id: tool-poisoning-docstring-candidate
    languages: [python]
    severity: WARNING
    message: >-
      Tool Poisoning (candidate, NOT an automatic error): Docstring/tool description
      contains a signal word that could indicate a hidden instruction to an
      AI agent (e.g. "<system>" tag, "ignore previous
      instructions", "you must", hidden HTML comment). This hit
      is explicitly ONLY a candidate for a separate layer-2 review
      (see P3-1) - not standalone evidence of tool poisoning. Harmless
      but similar-sounding wording in normal API documentation
      deliberately gets the same candidate status instead of being a false alarm.
    metadata:
      category: Tool Poisoning
      kind: candidate-for-review
      confidence: LOW
      references:
        - benchmark/vulnerable/tool_poisoning_docstring.py
        - benchmark/clean/example_server_appointments.py

    patterns:
      # Function whose first statement is a plain string (its docstring); $DOC captures the text.
      - pattern-either:
          - pattern: |
              def $FUNC(...):
                  "$DOC"
                  ...
          - pattern: |
              def $FUNC(...):
                  '$DOC'
                  ...

      # $DOC contains a phrase suggesting a hidden instruction to an AI agent.
      - metavariable-regex:
          metavariable: $DOC
          regex: (?is).*(<\s*system\s*>|ignore\s+(the\s+)?previous\s+instructions|you\s+must|<!--).*
