# Hardcoded Secret: secrets typed directly as string literals in source code.
# Comments must stay outside "|" blocks - inside them they become part of the pattern text.

rules:
  - id: hardcoded-secret
    languages: [python]
    severity: ERROR
    message: >-
      Hardcoded Secret: Value looks like a hardcoded API key/token/secret.
      Secrets belong in environment variables or a secret manager,
      not as a literal in source code.
    metadata:
      category: Hardcoded Secret
      kind: security
      references:
        - benchmark/vulnerable/hardcoded_api_key.py

    pattern-either:
      # Variable name looks secret-ish and the value is long enough to be a real secret.
      - patterns:
          - pattern: $VAR = "$VAL"
          - metavariable-regex:
              metavariable: $VAR
              regex: (?i)^.*(api_?key|token|secret|password|passwd|credential|access_key).*$
          - metavariable-regex:
              metavariable: $VAL
              regex: ^.{20,}$

      # Value itself starts with a known test/demo secret prefix, regardless of variable name.
      - patterns:
          - pattern: $VAR = "$VAL"
          - metavariable-regex:
              metavariable: $VAL
              regex: (?i)^(demo_key_|srv_test_|bearer\s).+$
