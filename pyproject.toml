[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpthreat-scan"
version = "0.1.0"
description = "Static zero-execution security scanner for MCP server source code"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Taha Al-Faqih" }]
keywords = ["mcp", "security", "scanner", "static-analysis", "semgrep"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Environment :: Console",
]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/0xtahaa/MCPThreat-Scan"
Source = "https://github.com/0xtahaa/MCPThreat-Scan"
Issues = "https://github.com/0xtahaa/MCPThreat-Scan/issues"

[project.scripts]
mcpthreat-scan = "mcpthreat_scan.cli.main:main"

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Textual stylesheet of the TUI; loaded via CSS_PATH relative to the app class (Phase 11, AR-146).
# Semgrep rules and the curated known-servers list are read relative to the analyzer modules
# (Phase 12, AR-152/AR-154).
mcpthreat_scan = [
    "tui/app.tcss",
    "resources/known_mcp_servers.json",
    "resources/rules/*.yaml",
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
